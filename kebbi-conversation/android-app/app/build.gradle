plugins { id 'com.android.application' }
android {
    namespace 'jp.ojimalab.kebbi'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.ojimalab.kebbi.conversation'
        minSdk 26
        // NUWA 2.1.0.08 targets older robot services; this is a sideloaded research app.
        targetSdk 28
        versionCode 7
        versionName '0.4.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    flavorDimensions += 'robot'
    productFlavors {
        mock { dimension 'robot'; applicationIdSuffix '.mock' }
        real { dimension 'robot' }
    }
    sourceSets { real.assets.srcDirs += rootProject.file('../config') }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
// No reference to the vendor AAR in the mock dependency graph.
// Accept a replacement SDK with -PnuwaSdk=/absolute/path/to/sdk.aar.
def sdkPath = providers.gradleProperty('nuwaSdk').orElse(
    new File(rootDir, '../../sdk/nuwa/NuwaSDK-2023-10-11_v2.1.0.08_513b45c_release.aar').absolutePath)
tasks.matching { it.name == 'preRealDebugBuild' || it.name == 'preRealReleaseBuild' }.configureEach {
    doFirst { if (!file(sdkPath.get()).isFile()) throw new GradleException('NUWA AAR missing: run bash ../../scripts/download-nuwa-sdk.sh or supply -PnuwaSdk=/path/sdk.aar. Mock builds do not need an AAR.') }
}
dependencies {
    implementation project(':core')
    realImplementation files(sdkPath.get())
    realImplementation 'androidx.appcompat:appcompat:1.7.0'
    realImplementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
