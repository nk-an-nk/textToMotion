name: Build Kebbi real APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kebbi-real-apk.yml"
      - "kebbi-conversation/android-app/**"
      - "kebbi-conversation/backend/**"
      - "kebbi-conversation/config/**"
      - "kebbi-conversation/scripts/verify.sh"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - name: Download and verify manufacturer SDK
        run: bash scripts/download-nuwa-sdk.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -r kebbi-conversation/backend/requirements-dev.txt
      - name: Verify TTS diagnostic analysis
        run: python -m unittest discover -s kebbi-conversation/scripts -p 'test_tts_benchmark.py' -v
      - name: Verify backend, controller and three HTTP experiment paths
        env:
          KEBBI_PYTHON: python
        run: bash kebbi-conversation/scripts/verify.sh
      - name: Build real debug APK
        working-directory: kebbi-conversation/android-app
        run: bash gradlew --no-daemon :app:assembleRealDebug
      - name: Record APK checksum
        working-directory: kebbi-conversation/android-app/app/build/outputs/apk/real/debug
        run: sha256sum app-real-debug.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: kebbi-real-debug
          path: |
            kebbi-conversation/android-app/app/build/outputs/apk/real/debug/app-real-debug.apk
            kebbi-conversation/android-app/app/build/outputs/apk/real/debug/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
